<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending Collections</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap');

  * { box-sizing: border-box; }
  body{ margin:0; font-family:'Karla', Arial, sans-serif; background:#fff; }

  :root{
    --ink:#1c1c1c;
    --gold:#b9852e;
    --muted:#8a7f70;
  }

  .tc-section{ padding:60px 20px 80px; max-width:1240px; margin:0 auto; }

  .tc-header{ text-align:center; margin-bottom:36px; }
  .tc-header .eyebrow{
    display:block;
    font-size:12px;
    letter-spacing:3px;
    text-transform:lowercase;
    color:var(--gold);
    margin-bottom:6px;
    font-style:italic;
  }
  .tc-header h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(30px, 4.5vw, 48px);
    color:var(--ink);
    margin:0;
  }
  .tc-header .rule{
    width:70px;
    height:2px;
    background:var(--ink);
    margin:14px auto 0;
  }

  /* ---------- shared card look ---------- */
  .tc-card{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    display:block;
    text-decoration:none;
    color:#fff;
    background:#eee;
  }
  .tc-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .tc-card .tc-badge{
    position:absolute;
    top:16px;
    left:16px;
    background:#e6c98a;
    color:#3a2c12;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    padding:6px 12px;
    border-radius:4px;
    z-index:2;
  }
  .tc-card .tc-shade{
    position:absolute;
    left:0; right:0; bottom:0;
    height:55%;
    background:linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
    z-index:1;
  }
  .tc-card .tc-name{
    position:absolute;
    left:20px;
    bottom:18px;
    z-index:2;
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
  }

  /* =========================================================
     DESKTOP: 1 big + 6 grid, then a carousel for items 8-11
     ========================================================= */
  .tc-desktop{ display:block; }
  .tc-mobile{ display:none; }

  .tc-grid{
    width:100%;
    max-width:1145.83px;
    height:451px;
    margin:0 auto;
    display:grid;
    grid-template-columns: 3fr 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap:16px;
  }
  .tc-grid .tc-card.big{
    grid-column:1;
    grid-row:1 / span 2;
  }
  .tc-grid .tc-card.big .tc-name{ font-size:32px; }

  /* the 6 small cards fill the remaining 6 grid cells automatically
     in row-major order because grid-auto-flow default is row */

  /* items 8-11 auto-scroll continuously in a single line (marquee-style carousel) */
  .tc-row-desktop{
    max-width:1145.83px;
    margin:24px auto 0;
    overflow:hidden;
    position:relative;
    height:250px;
    border-radius:8px;
  }
  .tc-row-desktop::before,
  .tc-row-desktop::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width:60px;
    z-index:4;
    pointer-events:none;
  }
  .tc-row-desktop::before{ left:0; background:linear-gradient(to right, #fff, rgba(255,255,255,0)); }
  .tc-row-desktop::after{ right:0; background:linear-gradient(to left, #fff, rgba(255,255,255,0)); }

  .tc-track-desktop{
    display:flex;
    gap:16px;
    width:max-content;
    height:100%;
    animation: tcMarquee 18s linear infinite;
  }
  .tc-row-desktop:hover .tc-track-desktop{ animation-play-state:paused; }

  .tc-track-desktop .tc-card{
    width:250px;
    height:250px;
    flex-shrink:0;
  }
  .tc-track-desktop .tc-card .tc-name{ font-size:19px; }

  @keyframes tcMarquee{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  .tc-carousel-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid #ddd;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
    color:var(--ink);
    z-index:5;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .tc-carousel-nav.prev{ left:-21px; }
  .tc-carousel-nav.next{ right:-21px; }

  .tc-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:18px;
  }
  .tc-dots .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:#e0dcd3;
    cursor:pointer;
    transition:background .3s;
  }
  .tc-dots .dot.active{ background:var(--gold); }

  /* =========================================================
     MOBILE: single carousel of all 11 collections
     ========================================================= */
  @media (max-width:900px){
    .tc-section{ padding:40px 16px 60px; }
    .tc-desktop{ display:none; }
    .tc-mobile{ display:block; }

    .tc-mobile-carousel{
      width:290px;
      max-width:100%;
      margin:0 auto;
      position:relative;
    }
    .tc-carousel-track-m{
      display:flex;
      overflow:hidden;
      border-radius:10px;
      touch-action:pan-y;
    }
    .tc-slide-m{
      min-width:100%;
      flex-shrink:0;
    }
    .tc-slide-m .tc-card{
      width:290px;
      height:350px;
      max-width:100%;
    }
    .tc-slide-m .tc-card .tc-name{ font-size:22px; }

    .tc-mobile-nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:14px;
    }
    .tc-mobile-nav .tc-carousel-nav{
      position:static;
      transform:none;
    }
  }
</style>
</head>
<body>

<section class="tc-section">

  <div class="tc-header">
    <span class="eyebrow">curated</span>
    <h2>Trending Collections</h2>
    <div class="rule"></div>
  </div>

  <!-- ================= DESKTOP ================= -->
  <div class="tc-desktop">

    <div class="tc-grid" id="tcGridDesktop"></div>

    <div class="tc-row-desktop">
      <div class="tc-track-desktop" id="tcRowDesktop"></div>
    </div>

  </div>

  <!-- ================= MOBILE ================= -->
  <div class="tc-mobile">
    <div class="tc-mobile-carousel">
      <div class="tc-carousel-track-m" id="tcTrackMobile"></div>
      <div class="tc-dots" id="tcDotsMobile"></div>
      <div class="tc-mobile-nav">
        <div class="tc-carousel-nav prev" id="tcPrevMobile">&#10094;</div>
        <div class="tc-carousel-nav next" id="tcNextMobile">&#10095;</div>
      </div>
    </div>
  </div>

</section>

<script>
/* ============================================================
   EDIT YOUR 11 COLLECTIONS HERE
   ============================================================ */
const collections = [
  { title:"Abstract",            badge:"DESIGNER'S CHOICE", image:"https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=900&q=80", link:"/collections/abstract" },
  { title:"Landscape",           badge:"NEW ART DROPS",     image:"https://images.unsplash.com/photo-1502691876148-a84978e59af8?w=700&q=80",  link:"/collections/landscape" },
  { title:"Boho",                badge:"",                  image:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=700&q=80",  link:"/collections/boho" },
  { title:"Exhibition Posters",  badge:"TRENDING",          image:"https://images.unsplash.com/photo-1549289524-06cf8837ace5?w=700&q=80",     link:"/collections/exhibition-posters" },
  { title:"Women Illustrations", badge:"",                  image:"https://images.unsplash.com/photo-1544967082-d9d25d867d66?w=700&q=80",     link:"/collections/women-illustrations" },
  { title:"Photography",         badge:"",                  image:"https://images.unsplash.com/photo-1531685250784-7569952593d2?w=700&q=80",  link:"/collections/photography" },
  { title:"Quotes",              badge:"",                  image:"https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=700&q=80",  link:"/collections/quotes" },
  { title:"Botanical",           badge:"",                  image:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=700&q=80",  link:"/collections/botanical" },
  { title:"Minimal",             badge:"",                  image:"https://images.unsplash.com/photo-1487958449943-2429e8be8625?w=700&q=80",  link:"/collections/minimal" },
  { title:"Vintage",             badge:"",                  image:"https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=700&q=80",  link:"/collections/vintage" },
  { title:"Typography",          badge:"",                  image:"https://images.unsplash.com/photo-1455390582262-044cdead277a?w=700&q=80",  link:"/collections/typography" }
];

function cardHTML(item, big){
  return (
    '<a class="tc-card' + (big ? ' big' : '') + '" href="' + item.link + '">' +
      (item.badge ? '<span class="tc-badge">' + item.badge + '</span>' : '') +
      '<img src="' + item.image + '" alt="' + item.title + '">' +
      '<span class="tc-shade"></span>' +
      '<span class="tc-name">' + item.title + '</span>' +
    '</a>'
  );
}

/* ---------------- DESKTOP: card 1 big + cards 2-7 grid ---------------- */
const gridDesktop = document.getElementById("tcGridDesktop");
gridDesktop.innerHTML = cardHTML(collections[0], true) +
  collections.slice(1, 7).map(function(c){ return cardHTML(c, false); }).join("");

/* ---------------- DESKTOP: items 8-11 auto-scroll in one continuous line ---------------- */
const remainingDesktop = collections.slice(7); // items 8,9,10,11
const rowDesktop = document.getElementById("tcRowDesktop");
const loopSet = remainingDesktop.concat(remainingDesktop); // duplicate for seamless infinite scroll
rowDesktop.innerHTML = loopSet.map(function(c){ return cardHTML(c, false); }).join("");

/* ---------------- MOBILE: single carousel of all 11 ---------------- */
const trackMobile = document.getElementById("tcTrackMobile");
const dotsMobile = document.getElementById("tcDotsMobile");
trackMobile.innerHTML = collections.map(function(c){
  return '<div class="tc-slide-m">' + cardHTML(c, false) + '</div>';
}).join("");
dotsMobile.innerHTML = collections.map(function(_, idx){
  return '<span class="dot" data-slide="' + idx + '"></span>';
}).join("");

let mobileIndex = 0;
const mobileSlideCount = collections.length;
const dotsMobileEls = dotsMobile.querySelectorAll(".dot");

function goToMobileSlide(i){
  mobileIndex = (i + mobileSlideCount) % mobileSlideCount;
  trackMobile.style.transform = "translateX(-" + (mobileIndex * 100) + "%)";
  dotsMobileEls.forEach(function(d, idx){ d.classList.toggle("active", idx === mobileIndex); });
}
trackMobile.style.transition = "transform 0.5s ease";
document.getElementById("tcPrevMobile").addEventListener("click", function(){ goToMobileSlide(mobileIndex - 1); });
document.getElementById("tcNextMobile").addEventListener("click", function(){ goToMobileSlide(mobileIndex + 1); });
dotsMobileEls.forEach(function(d){
  d.addEventListener("click", function(){ goToMobileSlide(parseInt(this.dataset.slide, 10)); });
});
goToMobileSlide(0);

/* touch swipe support on mobile carousel */
let touchStartX = 0;
let touchEndX = 0;
trackMobile.addEventListener("touchstart", function(e){ touchStartX = e.touches[0].clientX; }, { passive:true });
trackMobile.addEventListener("touchend", function(e){
  touchEndX = e.changedTouches[0].clientX;
  const diff = touchStartX - touchEndX;
  if (Math.abs(diff) > 40) {
    if (diff > 0) { goToMobileSlide(mobileIndex + 1); }
    else { goToMobileSlide(mobileIndex - 1); }
  }
}, { passive:true });
</script>

</body>
</html>
